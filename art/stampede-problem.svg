<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="32" y="44" font-size="22" font-weight="700" fill="#111827">The problem: a cache stampede</text>
  <text x="32" y="70" font-size="14" fill="#4b5563">One key expires. Every request that arrives in the next few milliseconds sees a miss and recomputes the same value.</text>

  <!-- timeline -->
  <line x1="60" y1="150" x2="900" y2="150" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowGrey)"/>
  <text x="900" y="140" font-size="12" fill="#6b7280" text-anchor="end">time</text>

  <!-- cached bar -->
  <rect x="60" y="120" width="480" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="300" y="140" font-size="13" fill="#1e3a8a" text-anchor="middle">value cached, served in ~1 ms</text>

  <!-- expiry -->
  <line x1="540" y1="100" x2="540" y2="230" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="92" font-size="13" font-weight="600" fill="#c0392b" text-anchor="middle">TTL expires</text>

  <!-- miss zone -->
  <rect x="540" y="120" width="300" height="30" rx="6" fill="#fee2e2" stroke="#c0392b"/>
  <text x="690" y="140" font-size="13" fill="#7f1d1d" text-anchor="middle">every read is a miss</text>

  <!-- requests -->
  <g font-size="12" fill="#374151">
    <text x="560" y="205">req 1</text>
    <text x="610" y="205">req 2</text>
    <text x="660" y="205">req 3</text>
    <text x="710" y="205">req 4</text>
    <text x="760" y="205">req 5</text>
    <text x="810" y="205">…</text>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <line x1="575" y1="212" x2="575" y2="300" marker-end="url(#arrow)"/>
    <line x1="625" y1="212" x2="625" y2="300" marker-end="url(#arrow)"/>
    <line x1="675" y1="212" x2="675" y2="300" marker-end="url(#arrow)"/>
    <line x1="725" y1="212" x2="725" y2="300" marker-end="url(#arrow)"/>
    <line x1="775" y1="212" x2="775" y2="300" marker-end="url(#arrow)"/>
  </g>
  <text x="675" y="185" font-size="12" fill="#6b7280" text-anchor="middle">N concurrent requests, N identical 3 s queries</text>

  <!-- database -->
  <g transform="translate(600 305)">
    <ellipse cx="75" cy="12" rx="75" ry="12" fill="#fecaca" stroke="#c0392b"/>
    <rect x="0" y="12" width="150" height="74" fill="#fecaca" stroke="#c0392b"/>
    <ellipse cx="75" cy="86" rx="75" ry="12" fill="#fecaca" stroke="#c0392b"/>
    <text x="75" y="46" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">database</text>
    <text x="75" y="66" font-size="12" fill="#7f1d1d" text-anchor="middle">CPU 100 %, pool exhausted</text>
  </g>

  <!-- left explanation -->
  <g font-size="13" fill="#374151">
    <text x="60" y="260" font-weight="600" fill="#111827">What actually happens</text>
    <text x="60" y="284">1. The cached value expires at the 60-minute mark.</text>
    <text x="60" y="306">2. Thousands of requests read a miss in the same instant.</text>
    <text x="60" y="328">3. Each one runs the same expensive computation.</text>
    <text x="60" y="350">4. The database saturates and requests time out.</text>
    <text x="60" y="372">5. The value is written N times with identical content.</text>
  </g>

  <text x="32" y="418" font-size="12" fill="#6b7280">Plain <tspan font-family="Menlo, Consolas, monospace">Cache::remember()</tspan> has no protection against this. Measured in this package's test suite: 50 workers, 50 computations.</text>
</svg>
