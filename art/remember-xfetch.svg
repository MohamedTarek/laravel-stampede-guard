<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="prob" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="32" y="44" font-size="22" font-weight="700" fill="#111827">rememberXFetch: refresh before it expires</text>
  <text x="32" y="70" font-size="14" fill="#4b5563">The cached value knows its own expiry and compute time. One reader refreshes it early, so nobody sees a miss.</text>

  <!-- envelope callout -->
  <rect x="60" y="96" width="340" height="86" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="76" y="120" font-size="13" font-weight="700" fill="#111827">What is stored under the key</text>
  <text x="76" y="142" font-size="12" fill="#374151" font-family="Menlo, Consolas, monospace">['v' => value, 'e' => expiry, 'd' => seconds]</text>
  <text x="76" y="162" font-size="12" fill="#374151">d = how long the callback took last time;</text>
  <text x="76" y="176" font-size="12" fill="#374151">slow values start refreshing earlier.</text>

  <!-- timeline axis -->
  <line x1="60" y1="250" x2="900" y2="250" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowGrey)"/>
  <text x="900" y="240" font-size="12" fill="#6b7280" text-anchor="end">time</text>

  <!-- cached bar -->
  <rect x="60" y="220" width="780" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="330" y="240" font-size="13" fill="#1e3a8a" text-anchor="middle">served from cache the whole time (~1 ms)</text>

  <!-- probability curve -->
  <path d="M 440 218 C 540 216, 610 205, 660 150 L 660 218 Z" fill="url(#prob)" stroke="none"/>
  <path d="M 440 218 C 540 216, 610 205, 660 150" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="640" y="128" font-size="12" fill="#5b21b6" text-anchor="end">probability of volunteering</text>
  <text x="640" y="144" font-size="11" fill="#6d28d9" text-anchor="end" font-family="Menlo, Consolas, monospace">now - d * beta * ln(rand) >= e</text>

  <!-- logical expiry -->
  <line x1="660" y1="100" x2="660" y2="300" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="668" y="104" font-size="13" font-weight="600" fill="#5b21b6">logical expiry</text>
  <text x="668" y="120" font-size="11" fill="#6d28d9">e = now + ttl</text>

  <!-- physical expiry -->
  <line x1="840" y1="150" x2="840" y2="300" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="840" y="140" font-size="12" fill="#4b5563" text-anchor="middle">physical expiry</text>
  <text x="840" y="156" font-size="11" fill="#6b7280" text-anchor="middle">ttl + grace_seconds</text>
  <rect x="660" y="220" width="180" height="30" fill="#e5e7eb" opacity="0.6"/>
  <text x="750" y="272" font-size="11" fill="#6b7280" text-anchor="middle">stale window if a refresh fails</text>

  <!-- volunteer -->
  <circle cx="600" cy="235" r="9" fill="#7c3aed"/>
  <text x="600" y="239" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">V</text>
  <line x1="600" y1="292" x2="600" y2="248" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="600" y="310" font-size="12" fill="#5b21b6" text-anchor="middle">one reader volunteers</text>
  <text x="600" y="326" font-size="12" fill="#5b21b6" text-anchor="middle">and takes the refresh lock</text>

  <!-- what the volunteer does -->
  <rect x="60" y="348" width="840" height="140" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="76" y="374" font-size="13" font-weight="700" fill="#4c1d95">What the volunteer does</text>
  <text x="76" y="398" font-size="12" fill="#374151"><tspan font-weight="600">queue mode (default):</tspan> returns the cached value at once and dispatches RefreshCacheJob.</text>
  <text x="76" y="416" font-size="12" fill="#374151">The job recomputes, rewrites the envelope and releases the lock.</text>
  <text x="76" y="440" font-size="12" fill="#374151"><tspan font-weight="600">inline mode:</tspan> recomputes in its own request under the lock and returns the fresh value.</text>
  <text x="76" y="464" font-size="12" fill="#374151">Other readers that pass the probability check lose the lock and just return the cached value.</text>
  <text x="76" y="480" font-size="12" fill="#374151">A failed refresh is reported, serves the stale value, and retries once per refresh_lock_seconds.</text>

  <text x="32" y="508" font-size="12" fill="#6b7280">A cold key (no envelope yet) goes through the same mutex as rememberWithLock, so the first fill is computed once too.</text>
</svg>
