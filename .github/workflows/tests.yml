name: tests

on:
  push:
    branches: [main, 3.x]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    name: L${{ matrix.laravel }} / PHP ${{ matrix.php }} / ${{ matrix.stability }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '11'
            testbench: '^9.6'  # 9.0-9.5 pair with Laravel 11.0-11.19, which disagree with Testbench about static \$latestResponse
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
        exclude:
          - laravel: '13'
            php: '8.2'
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, pcntl, posix
          coverage: none
      - name: Allow installing framework releases that carry security advisories
        # EOL Laravel majors have published advisories; Composer >= 2.9 refuses to
        # install them by default. The config key differs between Composer versions.
        run: |
          composer config audit.block-insecure false 2>/dev/null || true
          composer config policy.advisories.block false 2>/dev/null || true
      - name: Install dependencies
        run: |
          composer require "illuminate/cache:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction
      - name: Run tests
        run: vendor/bin/phpunit
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Allow installing framework releases that carry security advisories
        # EOL Laravel majors have published advisories; Composer >= 2.9 refuses to
        # install them by default. The config key differs between Composer versions.
        run: |
          composer config audit.block-insecure false 2>/dev/null || true
          composer config policy.advisories.block false 2>/dev/null || true
      - run: composer update --prefer-dist --no-interaction
      - run: composer analyse
      - run: composer lint
